<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ALPHA BLOCKS</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧱</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Pantalla de inicio (Splash pixel-art) -->
  <div id="splash"></div>

  <div class="app" id="app">
    <!-- Contenido principal -->
    <div id="main">
      <div class="topbar">
        <b>🧱 ALPHA BLOCKS</b>
        <button id="menuBtn" aria-label="Abrir menú de navegación">☰</button>
      </div>
      <h1 class="title">🧱 ALPHA BLOCKS</h1>
      <hr>
      <section id="view"></section>
    </div>

    <div id="backdrop"></div>

    <!-- Barra lateral (derecha en escritorio, drawer en móvil) -->
    <aside id="sidebar" aria-label="Menú de navegación">
      <button id="closeBtn" aria-label="Cerrar menú">✕</button>
      <h2>📚 Menú de Navegación</h2>
      <p>Selecciona el módulo a visualizar:</p>
      <div id="nav"></div>
      <hr>
      <div id="sbControls"></div>
    </aside>
  </div>

  <div id="tip"></div>
  <script src="app.js"></script>
</body>
</html>
